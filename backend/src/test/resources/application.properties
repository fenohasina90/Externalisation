# Tests : base H2 en mémoire (aucun MySQL requis).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Exécuter data.sql après la création du schéma Hibernate.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT (mêmes clés que l'application, usage test uniquement).
app.jwt.secret=aGVsbG8td29ybGQtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNi1jYWJleC12ZXJ5LWxvbmctc2VjcmV0
app.jwt.expiration-ms=3600000

# E-mail désactivé en test.
app.mail.enabled=false

# Stockage des documents (dossier temporaire de test).
app.document.storage-path=./target/test-documents
app.document.max-size=10485760

# Éviter les exécutions planifiées pendant les tests : les tests appellent
# explicitement le scheduler lorsqu'ils le souhaitent.
app.notification.echeance-initial-delay-ms=86400000
app.notification.echeance-check-delay-ms=86400000
