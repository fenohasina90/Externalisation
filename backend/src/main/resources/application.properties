spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_externalisation}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Par défaut, Hibernate vérifie que le schéma correspond aux entités sans le modifier.
# En développement uniquement, JPA_DDL_AUTO=update peut être utilisé pour créer/mettre à jour le schéma.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
# Charge les associations LAZY par lots : évite les N+1 sur les listes,
# les rapports et les échéanciers, sans changer les entités.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT : la clé est obligatoire et doit être fournie en Base64 (>= 32 octets).
# Ne jamais committer de secret dans ce fichier. Voir README.md.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS : liste d'origines autorisées, séparées par des virgules.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Stockage des documents
app.document.storage-path=./data/documents
# Taille maximale d'un fichier uploadé (octets)
app.document.max-size=10485760
# server.address=0.0.0.0
# server.port=8080

# Multipart (upload de documents et restauration de sauvegardes)
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=260MB

# Sauvegardes hors ligne (mysqldump/mysql)
backup.dir=${BACKUP_DIR:./data/backups}
# Rétention des archives (jours) : au-delà, les fichiers planifiés sont purgés
backup.retention-days=${BACKUP_RETENTION_DAYS:14}
# Heure par défaut de la sauvegarde automatique quotidienne (surchargée par HEURE_SAUVEGARDE_AUTOMATIQUE)
backup.heure=${BACKUP_HEURE:02:00}
backup.db.host=${BACKUP_DB_HOST:127.0.0.1}
backup.db.port=${BACKUP_DB_PORT:3306}
backup.db.name=${BACKUP_DB_NAME:gestion_externalisation}
backup.db.username=${BACKUP_DB_USERNAME:${spring.datasource.username}}
backup.db.password=${BACKUP_DB_PASSWORD:${spring.datasource.password}}
# Chemins des clients MySQL (par défaut dans le PATH)
backup.db.mysqldump-path=${MYSQLDUMP_PATH:mysqldump}
backup.db.mysql-path=${MYSQL_PATH:mysql}
# Taille maximale d'un fichier de restauration uploadé (octets)
backup.upload.max-size=${BACKUP_UPLOAD_MAX_SIZE:268435456}

# Vérification des échéances : 30 s après le démarrage, puis toutes les heures.
# Les notifications créées sont dédupliquées par utilisateur, type et échéance.
app.notification.echeance-initial-delay-ms=30000
app.notification.echeance-check-delay-ms=3600000

# Email (liens de reinitialisation de mot de passe)
# Par defaut l'envoi est desactive : le lien est journalise dans les logs.
# Pour un envoi reel : passer app.mail.enabled=true et renseigner spring.mail.*
app.mail.enabled=false
app.mail.from=no-reply@cabex.mg
app.mail.from-name=CABEX
