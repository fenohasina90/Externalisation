spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_externalisation
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT
app.jwt.secret=aGVsbG8td29ybGQtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNi1jYWJleC12ZXJ5LWxvbmctc2VjcmV0
app.jwt.expiration-ms=3600000

# Stockage des documents
app.document.storage-path=./data/documents
# Taille maximale d'un fichier uploadé (octets)
app.document.max-size=10485760

# Multipart (upload de documents)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Email (liens de reinitialisation de mot de passe)
# Par defaut l'envoi est desactive : le lien est journalise dans les logs.
# Pour un envoi reel : passer app.mail.enabled=true et renseigner spring.mail.*
app.mail.enabled=false
app.mail.from=no-reply@cabex.mg
app.mail.from-name=CABEX
